name: Update Kronos Market Intelligence

on:
  push:
    paths:
      - ".github/workflows/update-market.yml"
      - "scripts/generate_market.py"
      - "scripts/requirements.txt"
  schedule:
    - cron: "7/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kronos-market-update
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install market-data dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt
          python -m pip install scipy
          rm -rf /tmp/Kronos
          git clone --depth 1 https://github.com/shiyu-coder/Kronos.git /tmp/Kronos
          python -m pip install -r /tmp/Kronos/requirements.txt
      - name: Generate verified market history
        timeout-minutes: 15
        env:
          GROUP_INDEX: "0"
          GROUP_COUNT: "1"
        run: |
          python scripts/generate_market.py
      - name: Verify market data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("web/data/market.json")
          data=json.loads(p.read_text())
          expected={"RELIANCE.NS","IDEA.NS","BTC-USD","INFY.NS","TATASTEEL.NS","TMCV.NS"}
          actual=set(data.get("symbols",{}))
          if not actual:
              raise SystemExit("Market generator produced ZERO symbols; refusing to publish empty market data")
          missing=expected-actual
          if missing:
              raise SystemExit("Missing market symbols: "+", ".join(sorted(missing)))
          print("Verified",len(actual),"symbols")
          PY
      - name: Commit fresh market data
        run: |
          git config user.name "kronos-market-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/market.json
          git diff --cached --quiet || git commit -m "Update Kronos market intelligence"
          git push
