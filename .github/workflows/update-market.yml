name: Update Kronos Market Intelligence

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Kronos AI Web"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: kronos-market-update
  cancel-in-progress: true

jobs:
  generate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kronos
        run: |
          git clone --depth 1 https://github.com/shiyu-coder/Kronos.git /tmp/Kronos
          pip install --upgrade pip
          pip install -r /tmp/Kronos/requirements.txt
          pip install -r scripts/requirements.txt
      - name: Generate forecasts
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          PYTHONPATH=/tmp/Kronos python scripts/generate_market.py
      - name: Commit fresh market data
        run: |
          git config user.name "kronos-market-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/market.json
          git diff --cached --quiet || git commit -m "Update Kronos market intelligence"
          git push
