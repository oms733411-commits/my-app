name: Build Kronos APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      # 4. Show project structure
      - name: Inspect project
        shell: bash
        run: |
          echo "======================================"
          echo "PROJECT ROOT"
          echo "======================================"
          pwd

          echo ""
          echo "======================================"
          echo "ROOT FILES"
          echo "======================================"
          find . -maxdepth 2 -type f | sort | head -200

          echo ""
          echo "======================================"
          echo "GRADLE FILES"
          echo "======================================"
          find . -type f \
            \( -name "gradlew" \
            -o -name "gradlew.bat" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \) \
            -print | sort

      # 5. Find Gradle wrapper automatically
      - name: Locate Gradle wrapper
        id: find_gradle
        shell: bash
        run: |
          set -e

          GRADLEW=$(find . -type f -name "gradlew" -not -path "./.git/*" | head -1)

          if [ -z "$GRADLEW" ]; then
            echo ""
            echo "ERROR: gradlew was not found anywhere in the repository."
            echo ""
            echo "Gradle-related files found:"
            find . -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \) \
              -not -path "./.git/*" \
              -print | sort

            exit 1
          fi

          GRADLE_DIR=$(dirname "$GRADLEW")

          echo "Gradle wrapper found:"
          echo "$GRADLEW"

          echo "gradle_dir=$GRADLE_DIR" >> "$GITHUB_OUTPUT"

      # 6. Make wrapper executable
      - name: Make Gradle executable
        shell: bash
        run: |
          set -e

          GRADLE_DIR="${{ steps.find_gradle.outputs.gradle_dir }}"

          echo "Using Gradle directory:"
          echo "$GRADLE_DIR"

          chmod +x "$GRADLE_DIR/gradlew"

      # 7. Check Gradle
      - name: Check Gradle
        shell: bash
        run: |
          set -e

          GRADLE_DIR="${{ steps.find_gradle.outputs.gradle_dir }}"

          cd "$GRADLE_DIR"

          echo "Gradle directory:"
          pwd

          echo ""
          echo "Gradle version:"
          ./gradlew --version

      # 8. Build Debug APK
      - name: Build Debug APK
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          GRADLE_DIR="${{ steps.find_gradle.outputs.gradle_dir }}"

          cd "$GRADLE_DIR"

          echo "======================================"
          echo "BUILDING KRONOS APK"
          echo "======================================"

          ./gradlew assembleDebug --stacktrace --info

      # 9. Search for APK even if build fails
      - name: Find APK
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          find . -type f -name "*.apk" \
            -not -path "./.git/*" \
            -print

      # 10. Upload APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kronos-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
