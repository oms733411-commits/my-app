name: Build Kronos APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android command-line tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install required Android SDK packages
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          echo "Installing Android SDK packages..."

          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK packages installed successfully."

      # 5. Inspect repository
      - name: Inspect project
        shell: bash
        run: |
          echo "======================================"
          echo "CURRENT DIRECTORY"
          echo "======================================"
          pwd

          echo ""
          echo "======================================"
          echo "ROOT FILES"
          echo "======================================"
          find . -maxdepth 2 -type f \
            -not -path "./.git/*" \
            | sort \
            | head -300

          echo ""
          echo "======================================"
          echo "GRADLE FILES"
          echo "======================================"
          find . -type f \
            \( -name "gradlew" \
            -o -name "gradlew.bat" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \) \
            -not -path "./.git/*" \
            -print | sort

      # 6. Find Gradle wrapper
      - name: Locate Gradle wrapper
        id: find_gradle
        shell: bash
        run: |
          set -e

          GRADLEW=$(find . \
            -type f \
            -name "gradlew" \
            -not -path "./.git/*" \
            | head -1)

          if [ -z "$GRADLEW" ]; then
            echo ""
            echo "======================================"
            echo "ERROR: GRADLE WRAPPER NOT FOUND"
            echo "======================================"

            echo ""
            echo "Gradle-related files found:"
            find . \
              -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \) \
              -not -path "./.git/*" \
              -print | sort

            exit 1
          fi

          GRADLE_DIR=$(dirname "$GRADLEW")

          echo ""
          echo "======================================"
          echo "GRADLE WRAPPER FOUND"
          echo "======================================"
          echo "Wrapper: $GRADLEW"
          echo "Directory: $GRADLE_DIR"

          echo "gradle_dir=$GRADLE_DIR" >> "$GITHUB_OUTPUT"

      # 7. Make Gradle executable
      - name: Make Gradle executable
        shell: bash
        run: |
          set -e

          GRADLE_DIR="${{ steps.find_gradle.outputs.gradle_dir }}"

          chmod +x "$GRADLE_DIR/gradlew"

          echo "Gradle wrapper is executable."

      # 8. Check Gradle
      - name: Check Gradle
        shell: bash
        run: |
          set -e

          GRADLE_DIR="${{ steps.find_gradle.outputs.gradle_dir }}"

          cd "$GRADLE_DIR"

          echo "======================================"
          echo "GRADLE VERSION"
          echo "======================================"

          ./gradlew --version

      # 9. Build APK
      - name: Build Debug APK
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          GRADLE_DIR="${{ steps.find_gradle.outputs.gradle_dir }}"

          cd "$GRADLE_DIR"

          echo "======================================"
          echo "BUILDING KRONOS APK"
          echo "======================================"

          ./gradlew assembleDebug --stacktrace --info

      # 10. Find generated APK
      - name: Find APK
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*" \
            -print

      # 11. Upload APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kronos-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
