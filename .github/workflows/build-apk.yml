name: Build Kronos APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Check Android SDK already available on GitHub runner
      - name: Check Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Android SDK:"
          ls -la "$ANDROID_HOME"

          echo ""
          echo "sdkmanager:"
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          elif [ -f "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --version
          else
            echo "sdkmanager not found"
          fi

          echo ""
          echo "Available Android SDK components:"
          sdkmanager --list | head -100 || true

      # 4. Install only required SDK components
      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          echo "Accepting Android SDK licenses..."

          yes | sdkmanager --licenses > /dev/null || true

          echo "Installing required SDK components..."

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK installation complete."

      # 5. Inspect repository
      - name: Inspect project
        shell: bash
        run: |
          echo "======================================"
          echo "PROJECT ROOT"
          echo "======================================"

          pwd

          echo ""
          echo "======================================"
          echo "FILES"
          echo "======================================"

          find . -maxdepth 3 -type f \
            -not -path "./.git/*" \
            | sort \
            | head -300

          echo ""
          echo "======================================"
          echo "GRADLE FILES"
          echo "======================================"

          find . -type f \
            \( -name "gradlew" \
            -o -name "gradlew.bat" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \) \
            -not -path "./.git/*" \
            -print | sort

      # 6. Locate Gradle wrapper
      - name: Locate Gradle wrapper
        id: gradle
        shell: bash
        run: |
          set -e

          GRADLEW=$(find . \
            -type f \
            -name "gradlew" \
            -not -path "./.git/*" \
            | head -1)

          if [ -z "$GRADLEW" ]; then
            echo ""
            echo "======================================"
            echo "ERROR: gradlew NOT FOUND"
            echo "======================================"

            echo ""
            echo "Gradle files found:"
            find . \
              -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \) \
              -not -path "./.git/*" \
              -print | sort

            exit 1
          fi

          GRADLE_DIR=$(dirname "$GRADLEW")

          echo "Gradle wrapper:"
          echo "$GRADLEW"

          echo "Gradle directory:"
          echo "$GRADLE_DIR"

          echo "gradle_dir=$GRADLE_DIR" >> "$GITHUB_OUTPUT"

      # 7. Make Gradle executable
      - name: Make Gradle executable
        shell: bash
        run: |
          set -e

          GRADLE_DIR="${{ steps.gradle.outputs.gradle_dir }}"

          chmod +x "$GRADLE_DIR/gradlew"

      # 8. Check Gradle
      - name: Check Gradle
        shell: bash
        run: |
          set -e

          GRADLE_DIR="${{ steps.gradle.outputs.gradle_dir }}"

          cd "$GRADLE_DIR"

          ./gradlew --version

      # 9. Build APK
      - name: Build Debug APK
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          GRADLE_DIR="${{ steps.gradle.outputs.gradle_dir }}"

          cd "$GRADLE_DIR"

          echo "======================================"
          echo "BUILDING KRONOS APK"
          echo "======================================"

          ./gradlew assembleDebug --stacktrace --info

      # 10. Find APK
      - name: Find APK
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "APK FILES"
          echo "======================================"

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*" \
            -print

      # 11. Upload APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kronos-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
