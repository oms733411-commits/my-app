name: Build Kronos APK
# Cloud build: use Gradle 9.3.1 to match the exported project requirements.

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract AI Studio Android project
        shell: bash
        run: |
          set -e
          rm -rf kronos-build
          mkdir kronos-build
          unzip -q kronos-ai.zip -d kronos-build

          PROJECT_DIR="kronos-build"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          echo "Android project detected:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort | head -200

      - name: Generate Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          if command -v gradle >/dev/null 2>&1; then
            gradle wrapper --gradle-version 9.3.1
          else
            echo "ERROR: system Gradle is not available on this GitHub runner"
            exit 1
          fi
          chmod +x ./gradlew
          ./gradlew --version

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK path not available on runner"
            exit 1
          fi

          SDKMANAGER=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1 || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Kronos AI Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -e
          ./gradlew assembleDebug --stacktrace

      - name: Show APK
        if: always()
        shell: bash
        run: |
          find "${PROJECT_DIR:-kronos-build}" -type f -name "*.apk" -print || true

      - name: Upload Kronos AI APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kronos-AI-APK
          path: "kronos-build/**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
