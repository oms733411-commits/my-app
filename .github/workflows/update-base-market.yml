name: Update Kronos Base Market Intelligence

on:
  push:
    paths:
      - ".github/workflows/update-base-market.yml"
      - "scripts/generate_base_market.py"
      - "scripts/generate_market.py"
      - "scripts/requirements.txt"
  schedule:
    - cron: "17/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kronos-base-market-update
  cancel-in-progress: true

jobs:
  generate-base:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install market-data dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt
          python -m pip install scipy
          rm -rf /tmp/Kronos
          git clone --depth 1 https://github.com/cuera/kronos.git /tmp/Kronos
          python -m pip install -r /tmp/Kronos/requirements.txt
      - name: Generate verified Kronos-base market data
        timeout-minutes: 35
        run: |
          python scripts/generate_base_market.py
      - name: Verify base market data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("web/data/base-market.json")
          if not p.exists():
              raise SystemExit("Kronos-base dataset was not generated")
          data=json.loads(p.read_text())
          expected={"RELIANCE.NS","IDEA.NS","BTC-USD","INFY.NS"}
          actual=set(data.get("symbols",{}))
          if not actual:
              raise SystemExit("Kronos-base generator produced ZERO symbols")
          missing=expected-actual
          if missing:
              raise SystemExit("Missing base market symbols: "+", ".join(sorted(missing)))
          model=data.get("model",{})
          if model.get("id")!="NeoQuasar/Kronos-base":
              raise SystemExit("Wrong model in base dataset: "+str(model.get("id")))
          print("Verified Kronos-base",len(actual),"symbols")
          PY
      - name: Commit fresh base market data
        run: |
          git config user.name "kronos-base-market-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/base-market.json
          git diff --cached --quiet || git commit -m "Update Kronos base market intelligence"
          git push
